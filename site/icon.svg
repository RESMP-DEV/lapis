    </filter>
    <clipPath id="fc"><ellipse cx="512" cy="502" rx="259" ry="330"/></clipPath>
  </defs>
  <g id="tile">
    <rect x="76" y="88" width="872" height="872" rx="206" fill="#0B0E19"/>
    <rect id="tile-edge" x="76" y="76" width="872" height="872" rx="206" fill="url(#edge)"/>
    <rect id="tile-face" x="84" y="84" width="856" height="856" rx="198" fill="#1C2234"/>
  </g>
  <g id="cabochon">
    <g id="stone">
      <ellipse cx="512" cy="522" rx="283" ry="354" fill="#0A1027"/>
      <ellipse cx="512" cy="502" rx="283" ry="354" fill="url(#rim)"/>
      <ellipse cx="512" cy="502" rx="259" ry="330" fill="url(#dome)"/>
      <ellipse cx="512" cy="502" rx="259" ry="330" fill="url(#light)"/>
    </g>
    <g id="silk" clip-path="url(#fc)"><rect x="352" y="110" width="150" height="800" fill="url(#band)" transform="rotate(28 512 512)"/></g>
    <g id="star" fill="#FFFFFF">
      <polygon points="512.00,172.00 530.00,452.08 738.02,340.85 548.00,487.00 747.52,639.29 530.00,521.92 512.00,832.00 494.00,521.92 276.48,639.29 476.00,487.00 285.98,340.85 494.00,452.08" filter="url(#glow)" opacity=".5"/>
      <circle cx="512" cy="487" r="24" filter="url(#glow)" opacity=".5"/>
      <polygon points="512.00,175.15 530.00,452.08 735.76,342.31 548.00,487.00 745.16,637.77 530.00,521.92 512.00,828.55 494.00,521.92 278.84,637.77 476.00,487.00 288.24,342.31 494.00,452.08" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    </g>
