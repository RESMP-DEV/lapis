<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">lapis — Silk</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4A5FC8"/>
      <stop offset="1" stop-color="#16225E"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3348BC"/>
      <stop offset="1" stop-color="#1F2D79"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy=".3" r=".8">
      <stop stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="472" cy="400" r="430">
      <stop offset=".55" stop-color="#0A1027" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1027" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2=".45" y2="1">
      <stop stop-color="#A3ADC6"/>
      <stop offset=".46" stop-color="#4C5874"/>
      <stop offset="1" stop-color="#0D1221"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
