<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- lapis's icon: a lapis cabochon with a gold six-ray star, after the
       simplified Cabochon study. One full-bleed square for every platform:
       the iPhone masks it, and the Mac draws it at 824 px inside Apple's
       margin (scripts/package_macos.py icon). The in-app mark is the
       "stone" group alone on a transparent 148 148 728 728 view. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2=".78" y2="1">
      <stop stop-color="#D2DCFF"/><stop offset=".32" stop-color="#899CE7"/>
      <stop offset=".55" stop-color="#556BB7"/><stop offset="1" stop-color="#101B51"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="#1C2234"/>
  <g transform="translate(512 512) scale(1.1743) translate(-512 -512)">
    <g id="stone">
      <ellipse cx="512" cy="522" rx="283" ry="354" fill="#0A1027"/>
      <ellipse cx="512" cy="502" rx="283" ry="354" fill="url(#rim)"/>
      <ellipse cx="512" cy="505" rx="265" ry="336" fill="#142466"/>
      <ellipse cx="512" cy="502" rx="259" ry="330" fill="#293D9B"/>
      <polygon points="512.00,257.40 526.50,458.87 689.54,372.20 541.00,487.00 689.54,601.80 526.50,515.13 512.00,716.60 497.50,515.13 334.46,601.80 483.00,487.00 334.46,372.20 497.50,458.87" fill="#E5BF67"/>
    </g>
  </g>
</svg>
